name: Docker Image CI

on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:

  app-py-ci:

    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
            IMAGE_TAG=${GITHUB_SHA::7}-$(date +%F)
            echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
            docker build . --file Dockerfile --tag pyenne/gha-app-py:$IMAGE_TAG
    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_HUB_TOKEN }}"
    - name: Docker push
      run: docker push pyenne/gha-app-py:${IMAGE_TAG}
    - name: Update Deployment Manifest
      run: |
        sed -i "s/IMAGE_TAG/${IMAGE_TAG}/g" k8s/Dep.yml
    - name: git commit and push
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions@github.com"
        git add k8s/Dep.yml
        git commit -m "Update deployment manifest with new image tag"
        git push origin main
