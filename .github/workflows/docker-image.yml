name: Docker Image CI

on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:

  app-py-ci:

    #runs-on: ubuntu-latest #
    runs-on: self-hosted

    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - uses: sonarsource/sonarqube-scan-action@master
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
          skipSignatureVerification: true
    - name: Check SonarQube Quality Gate
      shell: pwsh
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        # Read report-task.txt generated by Sonar Scanner
             $report = Get-Content ".scannerwork/report-task.txt"

             $ceTaskUrl = ($report | Where-Object { $_ -match "^ceTaskUrl=" }) -replace "^ceTaskUrl=", ""

             Write-Host "Waiting for SonarQube analysis..."
             do {
              Start-Sleep -Seconds 5

                  $auth = [Convert]::ToBase64String(
              [System.Text.Encoding]::ASCII.GetBytes("${env:SONAR_TOKEN}:")
              )

            $task = Invoke-RestMethod `
        -Uri $ceTaskUrl `
        -Headers @{ Authorization = "Basic $auth" }

         Write-Host "Current Status: $($task.task.status)"

         } while ($task.task.status -eq "PENDING" -or $task.task.status -eq "IN_PROGRESS")
 
          if ($task.task.status -ne "SUCCESS") {
          throw "SonarQube analysis failed."
            }

            $analysisId = $task.task.analysisId

         $qualityGate = Invoke-RestMethod `
         -Uri "$env:SONAR_HOST_URL/api/qualitygates/project_status?analysisId=$analysisId" `
         -Headers @{ Authorization = "Basic $auth" }

          Write-Host "Quality Gate Status: $($qualityGate.projectStatus.status)" 

         if ($qualityGate.projectStatus.status -ne "OK") {
         throw "Quality Gate Failed!"
         }

          Write-Host "Quality Gate Passed."
    - name: Build the Docker image
      run: |
            IMAGE_TAG=${GITHUB_SHA::7}-$(date +%F)
            echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
            docker build . --file Dockerfile --tag pyenne/gha-app-py:$IMAGE_TAG
    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: "${{ secrets.DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKER_HUB_TOKEN }}"
    - name: Docker push
      run: docker push pyenne/gha-app-py:${IMAGE_TAG}
    - name: Update Deployment Manifest
      run: |
        sed -i "s|image:.*|image: pyenne/gha-app-py:${IMAGE_TAG}|g" k8s/Dep.yml
    - name: git commit and push
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions@github.com"
        git add k8s/Dep.yml
        git commit -m "Update deployment manifest with new image tag"
        git push origin main
